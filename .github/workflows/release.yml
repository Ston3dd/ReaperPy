name: Release

# Neuen Release bauen:   git tag v5.9.1 && git push origin v5.9.1
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install --upgrade pyinstaller -r requirements.txt
      - name: Tag must match version.py
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, ".")
          import version
          tag = os.environ["GITHUB_REF_NAME"].lstrip("vV")
          if tag != version.__version__:
              sys.exit(f"Tag {tag} != version.py {version.__version__} - erst version.py anheben, dann taggen")
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Build EXE (folder version)
        run: |
          python buildtools.py
          python -m PyInstaller --noconfirm --clean ReaperPy.spec
      - name: Package
        shell: pwsh
        run: |
          $ver = python -c "import version; print(version.__version__)"
          $zip = "dist/ReaperPy_v${ver}_win64.zip"
          Compress-Archive -Path "dist/ReaperPy/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  ReaperPy_v${ver}_win64.zip" | Out-File -Encoding ascii "$zip.sha256"
          "ASSET=$zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Release notes
        shell: bash
        run: python scripts/release_notes.py "${GITHUB_REF_NAME}" > notes.md || echo "Release ${GITHUB_REF_NAME}" > notes.md
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${ASSET}" "${ASSET}.sha256" \
            --title "ReaperPy ${GITHUB_REF_NAME}" --notes-file notes.md \
            $([[ "${GITHUB_REF_NAME}" == *-* ]] && echo --prerelease)
